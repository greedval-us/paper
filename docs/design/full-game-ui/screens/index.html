<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Держи линию — все эскизы</title><style>
@font-face{font-family:Notebook;src:url('../assets/NotebookHand.ttf')}*{box-sizing:border-box}body{margin:0;background:#edf2fa;color:#233953;font:16px/1.5 'Segoe UI',sans-serif}header{padding:42px 44px 30px;display:flex;align-items:center;justify-content:space-between;gap:30px}h1{font:42px/1.15 Notebook;margin:0 0 10px}p{color:#596c86;margin:0}a{color:inherit}header a{padding:12px 20px;border:1px solid #bccbeb;border-radius:12px;text-decoration:none}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:0 44px 44px}article{background:white;border:1px solid #dbe3ef;border-radius:18px;overflow:hidden}article img{display:block;width:100%;height:auto;aspect-ratio:1.6}article a{display:block;text-decoration:none}article footer{padding:15px 18px;display:flex;justify-content:space-between;gap:18px;border-top:1px solid #edf2fa}b{font-weight:600}small{color:#596c86}body.sheet header{padding:20px 24px}body.sheet h1{font-size:30px;margin:0}body.sheet header p{font-size:13px}body.sheet main{padding:0 24px 24px;gap:16px}body.sheet article footer{padding:10px 14px;font-size:14px}body.sheet header a{display:none}body.cover main{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{grid-template-columns:1fr;padding:0 16px 24px}header{padding:24px 16px;flex-wrap:wrap}h1{font-size:32px}}
</style></head><body><header><div><h1>Держи линию · «Чистый лист»</h1><p id="sub">28 игровых экранов и состояний · компоненты · карта переходов</p></div><a href="../index.html">Открыть кликабельный альбом ↗</a></header><main></main><script src="../catalog.js"></script><script>
let args=new URLSearchParams(location.search),items=SCREENS;
if(args.has('sheet')){let i=Number(args.get('sheet'));items=SCREENS.slice(i*6,i*6+6);document.body.classList.add('sheet');document.getElementById('sub').textContent='Лист '+(i+1)+' / 5 · Эскизы интерфейса · 1600 × 1000'}
if(args.has('cover')){items=['home','map','preparation','drawing','battle','victory'].map(id=>SCREENS.find(s=>s[0]===id));document.body.classList.add('sheet','cover')}
document.querySelector('main').innerHTML=items.map(s=>`<article><a href="../index.html#${s[0]}"><img src="${s[0]}.png" alt="${s[1]}"><footer><b>${String(SCREENS.indexOf(s)+1).padStart(2,'0')} · ${s[1]}</b><small>${s[2]}</small></footer></a></article>`).join('');
</script></body></html>
